# TEMPORARY: remove this file from PR #5 after visual sign-off, before merging.
name: PR 5 temporary visual review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-5-visual-review
  cancel-in-progress: true
jobs:
  visual-review:
    if: >-
      github.event.pull_request.number == 5 &&
      github.event.pull_request.head.ref == 'design/premium-editorial-refinement' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: site
          persist-credentials: false
      - name: Check out the accepted before snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4f7c268ab8fb2227145d3bec3a4501eed1dcc562
          path: baseline
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install temporary browser testing tools
        run: |
          python -m pip install Pillow==11.3.0
          npm install --prefix "$RUNNER_TEMP/kd-browser-tools" playwright@1.56.1
          "$RUNNER_TEMP/kd-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build and validate the accepted redesign
        working-directory: site
        run: |
          python scripts/build.py
          git diff --exit-code -- '*.html' sitemap.xml robots.txt
          python scripts/check_site.py
          python scripts/check_design.py --baseline ../baseline
          node scripts/test_tracking.js
      - name: Render six widths and capture before and after
        working-directory: site
        env:
          NODE_PATH: ${{ runner.temp }}/kd-browser-tools/node_modules
        run: |
          node scripts/review_visual.js --baseline ../baseline --output "$RUNNER_TEMP/kd-review"
      - name: Upload review evidence, including partial evidence on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kd-pr5-visual-review-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/kd-review
          if-no-files-found: warn
          retention-days: 14
